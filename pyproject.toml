[project]
name = "leadagent"
version = "0.1.0"
description = "Research agent that turns a list of companies into scored, cited, ready-to-send leads."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
leadagent = "leadagent.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["leadagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
