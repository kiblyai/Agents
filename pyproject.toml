[project]
name = "leadagent"
version = "0.1.0"
description = "AI agents: lead research (leadagent, also as an Apify Actor: leadactor), security-questionnaire drafting (secq) and medical chronologies (medchron)."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "pydantic>=2.6",
    "openpyxl>=3.1",
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
actor = ["apify>=4,<5"]  # only to run the Apify SDK test locally; the Apify image installs it itself

[project.scripts]
leadagent = "leadagent.__main__:main"
secq = "secq.__main__:main"
medchron = "medchron.__main__:main"
leadactor = "leadactor.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentkit", "leadagent", "leadactor", "secq", "medchron"]

[tool.pytest.ini_options]
testpaths = ["tests"]
